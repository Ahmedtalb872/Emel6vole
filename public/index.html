"use strict";
(function(qrcodegen) {
    class QrCode {
        version;
        errorCorrectionLevel;
        static encodeText(text, ecl) {
            const segs = qrcodegen.QrSegment.makeSegments(text);
            return QrCode.encodeSegments(segs, ecl);
        }
        static encodeBinary(data, ecl) {
            const seg = qrcodegen.QrSegment.makeBytes(data);
            return QrCode.encodeSegments([
                seg
            ], ecl);
        }
        static encodeSegments(segs, ecl, minVersion = 1, maxVersion = 40, mask = -1, boostEcl = true) {

                const usedBits = QrSegment.getTotalBits(segs, version);

                    break;
                }
                if (version >= maxVersion) throw new RangeError("Data too long");
            }
            for (const newEcl of [
                QrCode.Ecc.MEDIUM,
                QrCode.Ecc.QUARTILE,
                QrCode.Ecc.HIGH

            }
            let bb = [];
            for (const seg of segs){
                appendBits(seg.mode.modeBits, 4, bb);
                appendBits(seg.numChars, seg.mode.numCharCountBits(version), bb);
                for (const b of seg.getData())bb.push(b);
            }
            assert(bb.length == dataUsedBits);
            const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
            assert(bb.length <= dataCapacityBits);
            appendBits(0, Math.min(4, dataCapacityBits - bb.length), bb);
            appendBits(0, (8 - bb.length % 8) % 8, bb);
            assert(bb.length % 8 == 0);
            for(let padByte = 0xEC; bb.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11)appendBits(padByte, 8, bb);

            while(dataCodewords.length * 8 < bb.length)dataCodewords.push(0);

        mask;
        modules = [];
        isFunction = [];

            this.errorCorrectionLevel = errorCorrectionLevel;

            for(let i = 0; i < this.size; i++)row.push(false);

                this.isFunction.push(row.slice());

            const allCodewords = this.addEccAndInterleave(dataCodewords);

                    this.drawFormatBits(i);
                    const penalty = this.getPenaltyScore();

                    }

                }

            this.applyMask(msk);
            this.drawFormatBits(msk);

        }
        drawFunctionPatterns() {

                this.setFunctionModule(i, 6, i % 2 == 0);

            this.drawFinderPattern(this.size - 4, 3);
            this.drawFinderPattern(3, this.size - 4);

            this.drawVersion();

            this.setFunctionModule(8, 8, getBit(bits, 7));
            this.setFunctionModule(7, 8, getBit(bits, 8));
            for(let i = 9; i < 15; i++)this.setFunctionModule(14 - i, 8, getBit(bits, i));

                this.setFunctionModule(b, a, color);

        drawAlignmentPattern(x, y) {
            for(let dy = -2; dy <= 2; dy++){
                for(let dx = -2; dx <= 2; dx++)this.setFunctionModule(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) != 1);

            this.modules[y][x] = isDark;
            this.isFunction[y][x] = true;
        }

                k += dat.length;
                const ecc = QrCode.reedSolomonComputeRemainder(dat, rsDiv);
                if (i < numShortBlocks) dat.push(0);
                blocks.push(dat.concat(ecc));
            }
            let result = [];
            for(let i = 0; i < blocks[0].length; i++){
                blocks.forEach((block, j)=>{
                    if (i != shortBlockLen - blockEccLen || j >= numShortBlocks) result.push(block[i]);
                });
            }
            assert(result.length == rawCodewords);
            return result;
        }
        drawCodewords(data) {
            if (data.length != Math.floor(QrCode.getNumRawDataModules(this.version) / 8)) throw new RangeError("Invalid argument");

            for(let right = this.size - 1; right >= 1; right -= 2){
                if (right == 6) right = 5;

function categoryDonut(bens){const head='<div class="sectionhead"><h2>المستفيدون حسب الفئات</h2><button class="linkbtn" onclick="go(\'category\')">عرض الجميع</button></div>';if(!bens.length)return head+empty('الأثر يبدأ بملف واحد','أضف المستفيدين لتظهر هنا فئاتهم في رسم دائري.',addBtn('beneficiary','إضافة مستفيد'));const counts=categories.map(c=>[c,bens.filter(b=>b.categories?.includes(c)).length]).filter(c=>c[1]).sort((a,b)=>b[1]-a[1]);if(!counts.length)return head+empty('لم تحدد تصنيفات بعد','حدد تصنيفات الهشاشة داخل ملفات المستفيدين.');let slices=counts.slice(0,7).map(([c,n],i)=>({label:c,n,cls:'s'+(i+1)}));const rest=counts.slice(7).reduce((t,c)=>t+c[1],0);if(rest)slices.push({label:'فئات أخرى',n:rest,cls:'other'});const total=slices.reduce((t,x)=>t+x.n,0),C=2*Math.PI*38,gap=slices.length>1?1.4:0;let at=0;slices=slices.map(x=>{const len=x.n/total*C,seg={...x,pct:Math.round(x.n/total*100),dash:Math.max(len-gap,0.01).toFixed(3)+' '+(C-Math.max(len-gap,0.01)).toFixed(3),off:(-at).toFixed(3)};at+=len;return seg});donutData={slices,bens:bens.length,total};const tagged=bens.filter(b=>b.categories?.length).length;return head+'<div class="donutwrap"><div class="donut" role="img" aria-label="توزيع '+bens.length+' مستفيد على فئات الهشاشة"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="donuttrack" cx="50" cy="50" r="38"/>'+slices.map((x,i)=>'<circle class="seg '+x.cls+'" data-i="'+i+'" cx="50" cy="50" r="38" stroke-dasharray="'+x.dash+'" stroke-dashoffset="'+x.off+'" onpointerenter="donutFocus('+i+')" onpointerleave="donutFocus()" onclick="donutFocus('+i+')"/>').join('')+'</svg><div class="donutcenter"><strong id="donutValue">'+nf(bens.length)+'</strong><span id="donutLabel">مستفيد</span></div></div><ul class="donutlegend">'+slices.map((x,i)=>'<li data-i="'+i+'" onpointerenter="donutFocus('+i+')" onpointerleave="donutFocus()" onclick="donutFocus('+i+')"><i class="'+x.cls+'"></i><span>'+esc(x.label)+'</span><b>'+nf(x.n)+'</b><small>'+x.pct+'%</small></li>').jo function filterRequests(){const out=document.getElementById('requestsTable');if(!out)return;const q=(document.getElementById('requestSearch')?.value||'').trim().toLowerCase(),st=document.getElementById('requestFilter')?.value||'';const rs=membershipRequests.filter(r=>(!st||r.status===st)&&(!q||[r.name,r.residence,r.profession].join(' ').toLowerCase().includes(q)));out.innerHTML=rs.length?'<div class="tablewrap"><table><thead><tr><th>الاسم</th><th>محل الإقامة</th><th>المهنة</th><th>تاريخ الطلب</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>'+rs.map(r=>{const [label,cls]=requestStatus[r.status]||requestStatus.pending,id=esc(r.user_id);return '<tr><td>'+esc(r.name||'—')+'</td><td>'+esc(r.residence||'—')+'</td><td>'+esc(r.profession||'—')+'</td><td>'+esc(r.created_at?new Date(r.created_at).toLocaleDateString('ar'):'—')+'</td><td><span class="pill '+cls+'">'+label+'</span></td><td><button class="btn light" onclick="requestDetails(\''+id+'\')">الملف</button>'+(canReviewRequests?(r.status!=='approved'?' <button class="btn" onclick="reviewRequest(\''+id+'\',\'approved\')">قبول</button>':'')+(r.status!=='rejected'?' <button class="btn danger" onclick="reviewRequest(\''+id+'\',\'rejected\')">رفض</button>':''):'')+'</td></tr>'}).join('')+'</tbody></table></div>':empty(membershipRequests.length?'لا توجد طلبات مطابقة':'لا توجد طلبات انتساب بعد','تظهر هنا ملفات من أكملوا معلوماتهم في صفحة «ملفي».')}

async function saveForm(e,kind,id){e.preventDefault();if(busy)return;const form=e.target,fd=new FormData(form),data=Object.fromEntries(fd);if(kind==='beneficiary')data.categories=fd.getAll('categories');delete data.personPhoto;busy=true;document.getElementById('save').disabled=true;document.getElementById('save').textContent='جارٍ الحفظ…';document.getElementById('formError').classList.add('hidden');try{if(['worker','beneficiary','patient'].includes(kind))data.photo=await photoForForm(form,id);await api('/api/records'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify({kind,data})});await load();modal.close();toast('تم حفظ السجل بنجاح')}catch(e){const err=document.getElementById('formError');err.textContent=e.message;err.classList.remove('hidden');if(e.status===401){const link=document.createElement('a');link.href='/account';link.textContent=' تسجيل الدخول';err.append(link)}if(e.status===403){err.append(document.createTextNode(' — حفظ المداخيل والمصروفات يحتاج صلاحية مسؤول أو محرر من إدارة الجمعية.'))}err.focus();err.scrollIntoView({behavior:'smooth',block:'nearest'})}finally{busy=false;const button=document.getElementById('save');if(button){button.disabled=false;button.textContent='حفظ السجل'}}}

function reportData(){const mode=document.getElementById('reportMode').value,p=document.getElementById('reportPeriod').value;const period=mode==='year'?p.slice(0,4):p;const rs=records.filter(r=>r.date?.startsWith(period));const inc=rs.filter(r=>r.kind==='income'),aids=rs.filter(r=>r.kind==='aid');const before=records.filter(r=>r.date&&r.date.slice(0,period.length)<period);return {period,rs,inc,aids,opening:sum(before.filter(r=>r.kind==='income'))-costs(before),income:sum(inc),expense:costs(rs),beneficiaries:new Set(aids.map(a=>String(a.beneficiaryId))).size,members:list('member').filter(m=>m.joined?.startsWith(period)).length}}

function downloadCsv(filename,rows){const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'").replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function validPhoto(value){return typeof value==='string'&&value.length<=25000&&/^data:image\/jpeg;base64,\/9j\/[A-Za-z0-9+/=]+$/.test(value)}

function photoField(r){return '<div class="field wide"><label for="personPhoto">صورة الشخص</label><div class="photo-upload"><div id="photoPreview">'+photoMarkup(r)+'</div><div><input id="personPhoto" name="personPhoto" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewPhoto(this)"><p class="photo-help">صورة JPG أو PNG أو WebP، بحد أقصى 8 ميغابايت.</p><button type="button" class="linkbtn" onclick="removePhoto()">إزالة الصورة</button></div></div></div>'}
function removePhoto(){const form=document.getElementById('recordForm');form.dataset.removePhoto='true';document.getElementById('personPhoto').value='';document.getElementById('photoPreview').innerHTML=photoMarkup({});}
async function readPersonPhoto(file){if(!file)return '';if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('اختر صورة JPG أو PNG أو WebP');if(file.size>8*1024*1024)throw Error('حجم الصورة يجب ألا يتجاوز 8 ميغابايت');const url=URL.createObjectURL(file);try{const image=new Image();image.src=url;await image.decode();const canvas=document.createElement('canvas');canvas.width=240;canvas.height=300;const ctx=canvas.getContext('2d');if(!ctx)throw Error('تعذر تجهيز الصورة');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,240,300);const scale=Math.min(240/image.width,300/image.height);ctx.drawImage(image,(240-image.width*scale)/2,(300-image.height*scale)/2,image.width*scale,image.height*scale);let result='';for(const quality of [.8,.65,.5,.35,.2]){result=canvas.toDataURL('image/jpeg',quality);if(result.length<=25000)break}if(!validPhoto(result))throw Error('تعذر تصغير الصورة، اختر صورة أبسط');return result;}finally{URL.revokeObjectURL(url)}}
async function previewPhoto(input){const file=input.files[0];if(!file)return;try{const photo=await readPersonPhoto(file);if(document.getElementById('personPhoto')!==input)return;document.getElementById('recordForm').dataset.removePhoto='false';document.getElementById('photoPreview').innerHTML=photoMarkup({photo,name:'الشخص'});}catch(e){toast(e.message);input.value=''}}

function qrPayload(code){if(!/^(WRK|BEN|PAT)-[0-9]{6,}$/.test(code))throw Error('رقم البطاقة غير صالح');return 'EMEL6VOLE:'+code}
function qrSvg(code){const qr=qrcodegen.QrCode.encodeText(qrPayload(code),qrcodegen.QrCode.Ecc.MEDIUM);const border=4,size=qr.size+border*2;let path='';for(let y=0;y<qr.size;y++)for(let x=0;x<qr.size;x++)if(qr.getModule(x,y))path+='M'+(x+border)+','+(y+border)+'h1v1h-1z';return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges" role="img" aria-label="رمز QR للبطاقة '+esc(code)+'"><rect width="100%" height="100%" fill="white"/><path d="'+path+'" fill="black"/></svg>'}

لفات الحالات واحتياجاتها وتاريخ المساعدات": "Dossiers, besoins et historique des aides", "معاينة الواجهة · سجّل الدخول بحساب مصرح له لعرض السجلات وحفظ البيانات.": "Aperçu · Connectez-vous avec un compte autorisé pour consulter et enregistrer les données.", "حسابك ينتظر تفعيل صلاحياته من إدارة الجمعية.": "Votre compte attend l’activation des droits par l’association.", "أكمل الحقول المطلوبة، ثم احفظ السجل في حساب الجمعية.": "Complétez les champs obligatoires, puis enregistrez dans le compte de l’association.", "اكتب اسمك الكامل": "Indiquez votre nom complet", "المدينة، والحي أو القرية": "Ville, quartier ou village", "مثال: طالب، معلم، موظف…": "Exemple : étudiant, enseignant, salarié…", "اختر مجالًا أو اكتب كيف تحب أن تشارك…": "Choisissez un domaine ou décrivez votre contribution…", "أي معلومات ترغب في مشاركتها مع الجمعية…": "Informations que vous souhaitez partager…", "إظهار كلمة المرور": "Afficher le mot de passe", "إخفاء كلمة المرور": "Masquer le mot de passe", "الدولة ومفتاح الهاتف": "Pays et indicatif téléphonique", "فتح القائمة": "Ouvrir le menu", "إغلاق": "Fermer", "لكل طفل حق في الرعاية والتعليم والحماية. نجمع الاهتمام والجهود حول الأطفال والأسر الهشة، ليجدوا الدعم الذي يحتاجونه وفرصة أفضل للمستقبل.": "Chaque enfant a droit à l’accompagnement, à l’éducation et à la protection. Nous réunissons les efforts autour des enfants et des familles vulnérables pour leur apporter un soutien et de nouvelles perspectives.", "تتجه رسالة أمل الطفولة إلى رعاية الأطفال ومساندة الأسر التي تواجه ظروفًا صعبة، مع الاهتمام باحتياجات كل حالة على حدة. فالمساعدة تبدأ بفهم الوضع، ثم البحث عن الدعم المناسب.": "Notre mission est d’accompagner les enfants et les familles en difficulté. Nous prenons en compte les besoins de chaque situation pour proposer un soutien adapté.", "الاهتمام بالغذاء والكسوة والسكن، وتقديم الأولوية للحالات الأشد احتياجًا.": "Alimentation, habillement et logement, avec une priorité aux situations les plus urgentes.", "مساندة الأطفال المعرضين للتسرب من الدراسة، والاهتمام بما يساعدهم على التعلم.": "Accompagner les enfants exposés au décrochage scolaire et les aider à apprendre.", "التعامل مع الطفل وأسرته باحترام، وصون معلوماتهم الشخصية.": "Respecter les enfants et leurs familles, et protéger leurs informations personnelles.", "تتكامل احتياجات الطفل والأسرة؛ وقد تحتاج الحالة الواحدة إلى أكثر من نوع من المساندة.": "Les besoins de l’enfant et de sa famille sont liés. Une même situation peut nécessiter plusieurs formes d’aide.", "الاهتمام بالتعليم بوصفه طريقًا لفتح الفرص أمام الأطفال ومساعدتهم على بناء مستقبلهم.": "Faire de l’éducation une porte ouverte sur de nouvelles possibilités et un avenir meilleur.", "الاستجابة للاحتياجات الأساسية التي تؤثر في حياة الطفل واستقرار الأسرة.": "Répondre aux besoins essentiels de l’enfant et contribuer à la stabilité de sa famille.", "توجيه الاهتمام للأطفال الذين يحتاجون إلى حماية ومتابعة أو إلى دعم يناسب ظروفهم.": "Accompagner les enfants qui ont besoin de protection, de suivi ou d’un soutien adapté.", "نولي اهتمامًا للأطفال والأسر في أوضاع الهشاشة، مع مراعاة اختلاف الاحتياجات ودرجة الأولوية.": "Nous accompagnons les enfants et les familles vulnérables en tenant compte de leurs besoins et des priorités.", "يمكن أن تكون المساهمة وقتًا أو معرفة أو دعمًا يناسب احتياجات الأطفال والأسر.": "Votre contribution peut prendre la forme de temps, de compétences ou d’un soutien adapté aux besoins des familles.", "التطوع بالوقت أو مشاركة الخبرة في التعليم والمرافقة والتنظيم.": "Offrir du temps ou partager ses compétences en éducation, accompagnement et organisation.", "المساهمة بما يلبي الاحتياجات، مثل أدوات التعليم والغذاء والكسوة، أو دعم أوجه المساعدة.": "Contribuer avec du matériel scolaire, des aliments, des vêtements ou un soutien financier.", "التعريف باحتياجات الأطفال، ونشر ثقافة الرعاية واحترام كرامة الأسر.": "Faire connaître les besoins des enfants et encourager l’accompagnement dans le respect des familles.", "انضم إلى جهود رعاية الأطفال ومساندة الأسر. يمكنك تصفح موقع الجمعية دون حساب، وإنشاء حساب عندما ترغب في الانتساب.": "Participez à l’accompagnement des enfants et des familles. Le site est accessible sans compte ; créez-en un pour commencer votre adhésion.", "أنشئ حسابك برقم الهاتف وكلمة المرور، ثم تتولى إدارة الجمعية اعتماد العضوية. إنشاء الحساب لا يعني قبول الانتساب تلقائيًا.": "Créez votre compte avec votre téléphone et un mot de passe. L’association examinera votre adhésion ; la création du compte ne vaut pas validation.", "الأطفال والأسر في أوضاع الهشاشة، ومنهم الأيتام والأسر بلا معيل والأسر شديدة الفقر، والحالات التي تحتاج إلى تعليم أو رعاية أو حماية.": "Les enfants et familles vulnérables : orphelins, familles sans soutien ou très démunies, et personnes ayant besoin d’éducation, d’accompagnement ou de protection.", "لا؛ قد تكون المساندة عينية، مثل الغذاء والكسوة وأدوات التعليم، أو مساهمة بالوقت والخبرة والتوعية.": "Non. Le soutien peut aussi être matériel, bénévole ou prendre la forme d’un partage de compétences et de sensibilisation.", "نعم، فقد تتداخل احتياجات التعليم والغذاء والسكن وغيرها لدى الطفل أو الأسرة نفسها.": "Oui. Les besoins d’éducation, d’alimentation ou de logement peuvent se cumuler pour un enfant ou une famille.", "لا تُعرض الملفات الشخصية للمستفيدين أو بيانات أسرهم في صفحة الزوار.": "Les dossiers personnels des bénéficiaires et de leurs familles ne sont pas publiés sur le site.", "كن جزءًا من جهود الرعاية والمساندة. نبدأ معًا، ونصنع أثرًا يرافق الأطفال نحو مستقبل أفضل.": "Participez à nos efforts d’accompagnement. Ensemble, nous aidons les enfants à construire un avenir meilleur.", "إنشاء الحساب لا يعني قبول الانتساب؛ اعتماد العضوية يتم من إدارة الجمعية.": "La création du compte ne vaut pas acceptation de l’adhésion. Celle-ci est validée par l’association.", "موقع الجمعية متاح للجميع. حفظ ملفك وبطاقتك يحتاج الدخول إلى حسابك.": "Le site est ouvert à tous. Connectez-vous pour enregistrer votre dossier et votre carte.", "الاسم ومحل الإقامة مطلوبان، والصورة اختيارية.": "Le nom et le lieu de résidence sont obligatoires. La photo est facultative.", "نحتاج اسمك ومحل إقامتك. بقية المعلومات والصورة اختيارية.": "Indiquez votre nom et votre lieu de résidence. Les autres informations et la photo sont facultatives.", "يفضل أن تكون صورة واضحة لوجهك. يمكنك إكمال الملف دون صورة.": "Privilégiez une photo nette de votre visage. Vous pouvez compléter votre dossier sans photo.", "أكمل معلوماتك واحفظها ليظهر هنا ملفك وبطاقتك.": "Complétez et enregistrez vos informations pour afficher votre carte ici.", "هذه بطاقة ملف شخصي، وليست إثبات عضوية معتمدة. رمز QR يحتوي معرّف الملف فقط، دون معلوماتك الشخصية.": "Cette carte représente votre dossier personnel, sans attester une adhésion validée. Le QR contient uniquement l’identifiant du dossier, sans données personnelles.", "تم تسجيل دخولك. اعتماد الانتساب وصلاحيات العضوية يتم من إدارة الجمعية.": "Vous êtes connecté. L’adhésion et les droits sont validés par l’association.", "مستفيد غير متاح": "Bénéficiaire indisponible", "تعذر الاتصال": "Connexion impossible", "المداخيل ناقص المصروفات": "Recettes moins dépenses", "الأطفال المستفيدون": "Enfants bénéficiaires", "حدد تصنيفات الهشاشة داخل ملفات المستفيدين.": "Définissez les catégories dans les dossiers des bénéficiaires.", "الأثر يبدأ بملف واحد": "L’impact commence par un dossier", "أضف المستفيدين لتظهر هنا إحصائيات الفئات.": "Ajoutez des bénéficiaires pour afficher les statistiques.", "سجّل كل مساعدة لتحتفظ المنظمة بتاريخ واضح لكل حالة.": "Enregistrez chaque aide pour conserver un historique clair.", "تسجيل مساعدة": "Enregistrer une aide", "رقم العامل": "Identifiant du collaborateur", "الوظيفة": "Fonction", "الهاتف": "Téléphone", "رقم العملية": "Numéro d’opération", "المساهم / الجهة": "Contributeur / organisme", "المسؤول": "Responsable", "رقم الانتساب": "Numéro d’adhésion", "الاشتراك": "Cotisation", "السداد": "Règlement", "رقم الملف": "Numéro du dossier", "القرية / الحي": "Village / quartier", "الأولوية": "Priorité", "رقم المساعدة": "Numéro de l’aide", "الطبيعة": "Nature", "كل مساعدة موثقة، وكل مستفيد له تاريخ واضح": "Chaque .topbar #today{order:2;margin-inline-start:auto;font-size:13px;color:var(--site-text-green);opacity:.8}
.topbar .avatar{order:3;width:34px;height:34px}
.topbar .identity>a[href="/"]{order:4;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none}
.topbar .language-switch{order:5;margin-inline-start:0!important}
.topbar .appearance-switch{order:6}
.topbar #accountLink{order:7}
.topbar #accountLogout{order:8;display:inline-flex;align-items:center;gap:6px;background:#fdeeed;color:#b3362f;border:1px solid #f1c5c1;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
.topbar #accountLogout svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar #accountLogout:hover{background:#fadad7}
.topbar #accountLogout.hidden,.topbar #accountLink.hidden{display:none!important}
.topbar .mobilemenu{order:0}
@media(max-width:760px){
.topbar{padding:10px 16px!important;gap:8px 10px}
.topbar::before{content:"";order:5;flex-basis:100%;height:0}
.topbar .mobilemenu{display:grid!important;place-items:center;width:44px;height:44px;border-radius:12px;background:#3277ac!important;color:#fff!important;font-size:22px;line-height:1;box-shadow:0 4px 12px #3277ac40;cursor:pointer}
.topbar .avatar{order:1;width:40px;height:40px}
.topbar #accountLogout{order:3;margin-inline-start:auto;padding:9px 13px}
.topbar #accountLink{order:3;margin-inline-start:auto}
.topbar #today{order:6;margin-inline-start:0;font-size:12px}
.topbar .identity>a[href="/"]{order:7;font-size:12px;padding:5px 11px}
.topbar .language-switch{order:8;margin-inline-start:auto!important}
.topbar .appearance-switch{order:9}
.topbar .language-switch,.topbar .appearance-switch{min-height:32px;padding:4px 12px;font-size:12px}
}
html[data-appearance=dark] .topbar #accountLogout{background:#432b30!important;color:#ffc9c9!important;border-color:#745054!important}
html[data-appearance=dark] .topbar .mobilemenu{background:#3d8fd6!important;color:#fff!important}
</style></body></html>
