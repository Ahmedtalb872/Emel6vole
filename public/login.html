<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | أمل الطفولة</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f0f5fa;color:#173e60;font:16px/1.8 'Tajawal',Arial,sans-serif}.login{width:min(420px,100%);background:#fff;border:1px solid #d9e5ee;border-radius:18px;padding:30px;box-shadow:0 16px 45px #173e6010;border-top:5px solid #83a747}.logo{display:block;width:150px;height:150px;object-fit:contain;margin:0 auto 10px}h1{font-size:23px;text-align:center;margin:0 0 24px}label{display:block;margin:16px 0 6px;font-size:14px}input,button{font:inherit;width:100%;border-radius:8px;padding:11px 13px}input{border:1px solid #cddce7;color:#173e60;background:#fff}input:focus{outline:2px solid #acd0eb;border-color:#3277ac}button{border:0;background:#3277ac;color:white;cursor:pointer;margin-top:24px}button:disabled{opacity:.6}p{font-size:13px;color:#668093;text-align:center;margin:16px 0 0}.error{color:#aa3030;background:#fff2f0;padding:10px;border-radius:7px;text-align:right}.hidden{display:none}.brandline{height:3px;background:linear-gradient(to left,#3277ac 40%,#83a747 40% 70%,#e46692 70% 85%,#efbd47 85%);border-radius:4px;margin-top:25px}@media(max-width:480px){.login{padding:23px}.logo{width:130px;height:130px}}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body,button,input,select,textarea{font-family:'Tajawal',Arial,sans-serif}html[dir=ltr] body{font-family:'Tajawal',Arial,sans-serif}</style></head><body><main class="login"><img class="logo" src="__LOGO__" alt="شعار جمعية أمل الطفولة"><h1>الدخول إلى لوحة الجمعية</h1><form id="loginForm"><label for="username">اسم المستخدم</label><input id="username" name="username" value="admin" dir="ltr" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" required><p id="error" class="error hidden" role="alert"></p><button id="submit">تسجيل الدخول</button><p>يبقى الدخول محفوظًا على هذا الجهاز لمدة 30 يومًا.</p></form><div class="brandline"></div></main><script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.classList.add('hidden');try{const response=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const result=await response.json();if(!response.ok)throw Error(result.error||'تعذر تسجيل الدخول');location.replace('/')}catch(e){error.textContent=e.message;error.classList.remove('hidden')}finally{button.disabled=false}};</script></body></html>
